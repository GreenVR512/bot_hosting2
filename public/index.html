<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bot Controller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #121212;
      color: #e0e0e0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #fff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-online { background: #2e7d32; color: #fff; }
    .status-offline { background: #c62828; color: #fff; }
    .status-connecting { background: #f57f17; color: #fff; }

    .btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:hover { background: #444; }
    .btn-primary { background: #1976d2; }
    .btn-primary:hover { background: #1565c0; }
    .btn-danger { background: #d32f2f; }
    .btn-danger:hover { background: #c62828; }

    /* Action & GUI Controls */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .action-card {
      background: #282828;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .state-tag {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .state-tag.enabled { background: #2e7d32; color: #e8f5e9; }
    .state-tag.disabled { background: #424242; color: #9e9e9e; }

    .gui-input-group {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    input[type="text"], input[type="number"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      width: 100%;
    }

    .console {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 12px;
      border-radius: 4px;
      height: 250px;
      overflow-y: auto;
      margin-bottom: 10px;
      white-space: pre-wrap;
      font-size: 0.85rem;
    }

    .chat-input {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Status & Connection Card -->
    <div class="card">
      <div class="status-header">
        <h2>Bot Status</h2>
        <span id="bot-status-badge" class="status-badge status-offline">Offline</span>
      </div>
      <p><strong>Username:</strong> <span id="bot-username">-</span></p>
      <p><strong>Server:</strong> <span id="bot-server">-</span></p>
      <p><strong>Uptime:</strong> <span id="bot-uptime">0s</span></p>
      <br>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" onclick="startBot()">Start Bot</button>
        <button class="btn btn-danger" onclick="stopBot()">Stop Bot</button>
      </div>
    </div>

    <!-- Behavior Controls -->
    <div class="card">
      <h2>Behavior Settings</h2>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label>
          <input type="checkbox" id="chk-afk" onchange="updateBehavior()"> Anti-AFK Movement
        </label>
        <label>
          <input type="checkbox" id="chk-reconnect" onchange="updateBehavior()"> Auto Reconnect
        </label>
        <label>
          <input type="checkbox" id="chk-animals" onchange="updateBehavior()"> Auto Attack Animals
        </label>
      </div>
    </div>

    <!-- GUI & Item Action Controls -->
    <div class="card full-width">
      <h2>GUI & Action Controls</h2>
      <div class="action-grid">
        
        <!-- Slot Clicker -->
        <div class="action-card">
          <div class="action-card-header">
            <span>GUI Inventory Click</span>
            <span id="tag-gui-click" class="state-tag disabled">Disabled</span>
          </div>
          <div class="gui-input-group">
            <input type="number" id="click-slot-id" placeholder="Slot #" min="0" value="0">
            <button class="btn btn-primary" onclick="triggerSlotClick()">Click Slot</button>
          </div>
        </div>

        <!-- Swing Arm / Left Click -->
        <div class="action-card">
          <div class="action-card-header">
            <span>Swing Arm (Left-Click)</span>
            <span id="tag-swing" class="state-tag disabled">Disabled</span>
          </div>
          <button class="btn" onclick="triggerSwingArm()">Swing Arm</button>
        </div>

        <!-- Right Click / Use Item -->
        <div class="action-card">
          <div class="action-card-header">
            <span>Use Item (Right-Click)</span>
            <span id="tag-use" class="state-tag disabled">Disabled</span>
          </div>
          <button class="btn" onclick="triggerUseItem()">Use / Activate</button>
        </div>

      </div>
    </div>

    <!-- Live Console & Chat -->
    <div class="card full-width">
      <h2>Live Console</h2>
      <div id="console-log" class="console"></div>
      <div class="chat-input">
        <input type="text" id="chat-message" placeholder="Type chat message or command (/clickslot 0, /swing, /use)..." onkeypress="handleKeyPress(event)">
        <button class="btn btn-primary" onclick="sendChatMessage()">Send</button>
      </div>
    </div>

  </div>

  <script>
    let lastLogId = 0;
    let actionTimeoutWindow = null;

    // Helper to toggle status tags dynamically
    function setTagState(elementId, isEnabled, durationMs = 3000) {
      const tag = document.getElementById(elementId);
      if (!tag) return;

      if (isEnabled) {
        tag.textContent = "Enabled";
        tag.className = "state-tag enabled";
        
        if (durationMs > 0) {
          setTimeout(() => {
            tag.textContent = "Disabled";
            tag.className = "state-tag disabled";
          }, durationMs);
        }
      } else {
        tag.textContent = "Disabled";
        tag.className = "state-tag disabled";
      }
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        const badge = document.getElementById('bot-status-badge');
        badge.textContent = data.state;
        badge.className = `status-badge status-${data.state}`;

        document.getElementById('bot-username').textContent = data.username || '-';
        document.getElementById('bot-server').textContent = `${data.config.host}:${data.config.port}`;
        document.getElementById('bot-uptime').textContent = Math.floor(data.uptimeMs / 1000) + 's';

        document.getElementById('chk-afk').checked = !!data.behavior.antiAfk;
        document.getElementById('chk-reconnect').checked = !!data.behavior.autoReconnect;
        document.getElementById('chk-animals').checked = !!data.behavior.killAnimals;
      } catch (e) {
        console.error(e);
      }
    }

    async function fetchLogs() {
      try {
        const res = await fetch(`/api/logs?after=${lastLogId}`);
        const data = await res.json();
        
        if (data.logs && data.logs.length > 0) {
          const consoleEl = document.getElementById('console-log');
          data.logs.forEach(log => {
            consoleEl.innerText += `\n[${log.time.split('T')[1].slice(0, 8)}] ${log.message}`;
            lastLogId = log.id;
          });
          consoleEl.scrollTop = consoleEl.scrollHeight;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function startBot() {
      await fetch('/api/bot/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
      fetchStatus();
    }

    async function stopBot() {
      await fetch('/api/bot/stop', { method: 'POST' });
      setTagState('tag-gui-click', false, 0);
      setTagState('tag-swing', false, 0);
      setTagState('tag-use', false, 0);
      fetchStatus();
    }

    async function updateBehavior() {
      const behavior = {
        antiAfk: document.getElementById('chk-afk').checked,
        autoReconnect: document.getElementById('chk-reconnect').checked,
        killAnimals: document.getElementById('chk-animals').checked,
      };
      await fetch('/api/bot/behavior', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(behavior)
      });
    }

    async function triggerSlotClick() {
      const slot = parseInt(document.getElementById('click-slot-id').value, 10);
      try {
        const res = await fetch('/api/bot/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot, mouseButton: 0, mode: 0 })
        });
        const data = await res.json();
        if (data.ok) {
          setTagState('tag-gui-click', true, 2500);
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function triggerSwingArm() {
      try {
        const res = await fetch('/api/bot/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: '/swing' })
        });
        const data = await res.json();
        if (data.ok) {
          setTagState('tag-swing', true, 1500);
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function triggerUseItem() {
      try {
        const res = await fetch('/api/bot/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: '/use' })
        });
        const data = await res.json();
        if (data.ok) {
          setTagState('tag-use', true, 1500);
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-message');
      const message = input.value.trim();
      if (!message) return;

      await fetch('/api/bot/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendChatMessage();
    }

    setInterval(fetchStatus, 3000);
    setInterval(fetchLogs, 1000);
    fetchStatus();
    fetchLogs();
  </script>
</body>
</html>
